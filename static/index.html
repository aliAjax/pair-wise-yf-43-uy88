<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实验室仪器校准与方法验证</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    table { border-collapse: collapse; margin: .5rem 0 1.5rem; width: 100%; }
    th, td { border: 1px solid #d1d5db; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
    th { background: #f9fafb; }
    h3 { margin-bottom: .3rem; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
<main>
  <h1>实验室仪器校准与方法验证</h1>
  <p>这是最小演示页面。使用浏览器或 curl 调用 JSON API。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>

  <h2>校准记录与校准点</h2>
  <p><button onclick="loadCalibrations()">加载校准记录</button></p>
  <div id="calibrations"><p class="muted">尚未加载</p></div>

  <h2>检测结果与放行修正</h2>
  <p><button onclick="loadResults()">加载检测结果</button></p>
  <div id="results"><p class="muted">尚未加载</p></div>

  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions</pre>
</main>
<script>
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function (ch) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch];
  });
}

function show(value) {
  if (value === null || value === undefined || value === '') return '<span class="muted">—</span>';
  return escapeHtml(value);
}

async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadCalibrations() {
  const response = await fetch('/api/calibrations');
  const payload = await response.json();
  const items = payload.items || [];
  if (!items.length) {
    document.getElementById('calibrations').innerHTML = '<p class="muted">暂无校准记录</p>';
    return;
  }
  let html = '';
  for (const item of items) {
    const data = item.data || {};
    const points = data.points || [];
    html += '<h3>校准 ' + escapeHtml(item.id) +
      ' <span class="muted">状态 ' + escapeHtml(item.status) +
      '，仪器 ' + escapeHtml(data.instrument_id || '') + '</span></h3>';
    if (!points.length) {
      html += '<p class="muted">暂无校准点</p>';
      continue;
    }
    html += '<table><thead><tr><th>标准值</th><th>示值</th><th>扩展不确定度</th><th>到期日</th></tr></thead><tbody>';
    for (const point of points) {
      html += '<tr><td>' + show(point.standard) + '</td><td>' + show(point.indicated) +
        '</td><td>' + show(point.uncertainty) + '</td><td>' + show(point.due_at) + '</td></tr>';
    }
    html += '</tbody></table>';
  }
  document.getElementById('calibrations').innerHTML = html;
}

async function loadResults() {
  const response = await fetch('/api/results');
  const payload = await response.json();
  const items = payload.items || [];
  if (!items.length) {
    document.getElementById('results').innerHTML = '<p class="muted">暂无检测结果</p>';
    return;
  }
  let html = '<table><thead><tr><th>样品</th><th>状态</th><th>原始值</th><th>修正量</th>' +
    '<th>修正后数值</th><th>采用的校准点</th><th>待处理原因</th></tr></thead><tbody>';
  for (const item of items) {
    const data = item.data || {};
    const points = (data.calibration_points || []).map(function (p) {
      return '标准值 ' + p.standard + ' / 示值 ' + p.indicated;
    }).join('；');
    html += '<tr><td>' + show(data.sample_id) + '</td><td>' + show(item.status) +
      '</td><td>' + show(data.original_value) + '</td><td>' + show(data.correction) +
      '</td><td>' + show(data.corrected_value) + '</td><td>' + show(points) +
      '</td><td>' + show(data.hold_reason) + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('results').innerHTML = html;
}
</script>
</body>
</html>
